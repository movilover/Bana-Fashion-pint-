<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bena Fashion - Label Printer</title>
  <!-- JsBarcode Library -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <!-- QRCode Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .header-top {
      max-width: 1000px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }
    .header-top h1 {
      font-size: 1.4rem;
      color: var(--primary);
    }
    .history-btn {
      background: #0f172a;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .history-btn:hover { background: #334155; transform: translateY(-1px); }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
      border: 1px solid #e2e8f0;
    }
    h2 {
      margin-bottom: 15px;
      color: var(--text);
      font-size: 1.1rem;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 8px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #64748b;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row > div { flex: 1; }
    
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      font-size: 1rem;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:active { transform: scale(0.98); }
    
    /* PREVIEW AREA */
    .preview-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      padding: 20px;
      border-radius: 8px;
      border: 2px dashed #cbd5e1;
    }
    
    /* STICKER STYLES (38.25mm Exact Ratio) */
    .sticker {
      width: 200px;
      min-height: 180px;
      background: white;
      border: 1px solid #000;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }
    
    .sticker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #000;
      padding-bottom: 2px;
    }
    
    .logo-svg {
      width: 24px;
      height: 24px;
      fill: #000;
    }
    
    .brand-title {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: right;
    }
    
    .meta-info {
      display: flex;
      justify-content: space-between;
      font-size: 8px;
      font-weight: bold;
      margin: 2px 0;
      color: #000;
    }
    
    .product-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 2px 4px;
      border-radius: 3px;
      margin: 2px 0;
      border: 1px solid #e2e8f0;
    }
    .prod-name { font-size: 10px; font-weight: bold; }
    .prod-size { font-size: 10px; font-weight: 900; background: #000; color: #fff; padding: 1px 5px; border-radius: 3px; }
    
    .customer-box {
      border: 1px dashed #000;
      padding: 2px;
      font-size: 8px;
      margin: 2px 0;
      border-radius: 2px;
    }
    .customer-box strong { display: block; font-size: 8.5px; }
    
    .barcode-container {
      text-align: center;
      margin: 2px 0;
    }
    #barcode { width: 100%; max-height: 32px; }
    #qrcode { display: flex; justify-content: center; margin: 2px 0; }
    
    .price-box {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 3px;
      font-size: 12px;
      font-weight: 900;
      border-radius: 3px;
      letter-spacing: 0.5px;
    }

    /* HISTORY MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 10px;
    }
    .close-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
    }
    .history-item:hover { background: #f8fafc; }

    /* EXACT 38.25mm THERMAL PRINTER FIX */
    @media print {
      @page {
        size: 38.25mm auto;
        margin: 0;
      }
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 38.25mm;
      }
      .sticker {
        width: 38.25mm;
        page-break-after: always;
        border: none;
        box-shadow: none;
        padding: 1mm;
        margin: 0;
      }
    }
  </style>
</head>
<body>

<div class="header-top">
  <h1>✨ বেনা ফ্যাশন (প্রিন্টিং সিস্টেম)</h1>
  <button class="history-btn" onclick="playSound(); openHistoryModal()">📊 ইনভয়েস হিস্টরি (৭ দিন)</button>
</div>

<div class="container">
  <!-- CONTROL PANEL -->
  <div class="card">
    <h2>লেবেল কনফিগারেশন</h2>
    
    <div class="row">
      <div class="form-group">
        <label>প্রোডাক্ট আইটেম</label>
        <select id="itemSelect" onchange="playSound(); updateSticker()">
          <option value="Panjabi">পাঞ্জাবি (Panjabi)</option>
          <option value="T-Shirt">টি-শার্ট (T-Shirt)</option>
          <option value="Shirt">শার্ট (Shirt)</option>
          <option value="Polo Shirt">পোলো শার্ট (Polo Shirt)</option>
          <option value="Jeans">জিন্স (Jeans)</option>
          <option value="Trouser">ট্রাউজার (Trouser)</option>
          <option value="Jacket">জ্যাকেট (Jacket)</option>
        </select>
      </div>
      <div class="form-group">
        <label>সাইজ (Size)</label>
        <select id="sizeSelect" onchange="playSound(); updateSticker()">
          <option value="M">M</option>
          <option value="L" selected>L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
          <option value="3XL">3XL</option>
          <option value="S">S</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>মূল্য / প্রাইস (৳)</label>
        <input type="number" id="priceInput" value="1290" oninput="updateSticker()">
      </div>
      <div class="form-group">
        <label>কোড টাইপ</label>
        <select id="codeType" onchange="playSound(); toggleCodeType()">
          <option value="BARCODE">বারকোড (1D Barcode)</option>
          <option value="QR">কিউআর কোড (2D QR Code)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>কাস্টমারের নাম (ঐচ্ছিক)</label>
      <input type="text" id="custName" placeholder="যেমন: আব্দুর রহমান" oninput="updateSticker()">
    </div>
    
    <div class="form-group">
      <label>কাস্টমারের ঠিকানা / ফোন (ঐচ্ছিক)</label>
      <input type="text" id="custAddress" placeholder="যেমন: ঢাকা, ০১৭XXXXXXXX" oninput="updateSticker()">
    </div>

    <div class="row">
      <div class="form-group">
        <label>ইনভয়েস নং</label>
        <input type="text" id="invNum" value="INV-0001" readonly>
      </div>
      <div class="form-group">
        <label>বাল্ক প্রিন্ট সংখ্যা (১-৫০)</label>
        <input type="number" id="printQty" value="1" min="1" max="50">
      </div>
    </div>

    <button class="btn" onclick="playSound(); triggerPrint()">🖨️ প্রিন্ট দিন (Print Label)</button>
    <button class="btn" style="background:#64748b;" onclick="playSound(); resetSerial()">🔄 ইনভয়েস রিসেট করুন</button>
  </div>

  <!-- PREVIEW PANEL -->
  <div class="card">
    <h2>লেবেল প্রিভিউ (38.25mm)</h2>
    <div class="preview-box">
      <div class="sticker" id="stickerPreview">
        
        <!-- HEADER WITH PREMIUM SVG MONOGRAM -->
        <div class="sticker-header">
          <svg class="logo-svg" viewBox="0 0 100 100">
            <path d="M 20 10 H 65 C 80 10 80 40 65 40 H 40 V 90 H 20 Z M 40 25 V 30 H 60 C 65 30 65 25 60 25 Z" fill="#000"/>
            <path d="M 35 45 H 70 C 85 45 85 70 70 70 H 50 V 90 H 35 Z M 50 55 V 60 H 65 C 70 60 70 55 65 55 Z" fill="#000" opacity="0.85"/>
          </svg>
          <div class="brand-title">BENA FASHION</div>
        </div>

        <!-- DATE & INVOICE -->
        <div class="meta-info">
          <span id="lblDate">DATE: --/--/----</span>
          <span id="lblInv">INV-0001</span>
        </div>

        <!-- PRODUCT & SIZE -->
        <div class="product-details">
          <span class="prod-name" id="lblItem">Panjabi</span>
          <span class="prod-size" id="lblSize">L</span>
        </div>

        <!-- CUSTOMER INFO -->
        <div class="customer-box" id="custBox" style="display: none;">
          <strong id="lblCustName">Name: ---</strong>
          <span id="lblCustAddr">Addr: ---</span>
        </div>

        <!-- BARCODE / QR CODE -->
        <div class="barcode-container">
          <svg id="barcode"></svg>
          <div id="qrcode" style="display: none;"></div>
        </div>

        <!-- PRICE TAG -->
        <div class="price-box" id="lblPrice">
          PRICE: ৳ 1290
        </div>

      </div>
    </div>
  </div>
</div>

<!-- HISTORY MODAL -->
<div class="modal" id="historyModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>📜 বিগত ৭ দিনের ইনভয়েস হিস্টরি</h3>
      <button class="close-btn" onclick="closeHistoryModal()">✕ বন্ধ</button>
    </div>
    <div id="historyList">
      <!-- History items will load here -->
    </div>
  </div>
</div>

<!-- HIDDEN PRINT CONTAINER -->
<div id="printArea" style="display:none;"></div>

<script>
  let currentSerial = 1;

  // Web Audio API for Button Click Sound
  function playSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
      gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    } catch(e) {}
  }

  // Initialize Date and LocalStorage History Cleanup (7 Days)
  window.onload = function() {
    const today = new Date();
    const formattedDate = today.toLocaleDateString('en-GB');
    document.getElementById('lblDate').innerText = 'DATE: ' + formattedDate;
    
    const savedSerial = localStorage.getItem('bena_last_serial');
    if(savedSerial) {
      currentSerial = parseInt(savedSerial);
      document.getElementById('invNum').value = "INV-" + String(currentSerial).padStart(4, '0');
    }
    
    cleanOldHistory();
    updateSticker();
  };

  function updateSticker() {
    const item = document.getElementById('itemSelect').value;
    const size = document.getElementById('sizeSelect').value;
    const price = document.getElementById('priceInput').value || '0';
    const custName = document.getElementById('custName').value.trim();
    const custAddr = document.getElementById('custAddress').value.trim();
    const codeType = document.getElementById('codeType').value;

    document.getElementById('lblItem').innerText = item;
    document.getElementById('lblSize').innerText = size;
    document.getElementById('lblPrice').innerText = 'PRICE: ৳ ' + price;

    const custBox = document.getElementById('custBox');
    if (custName !== "" || custAddr !== "") {
      custBox.style.display = "block";
      document.getElementById('lblCustName').innerText = custName ? "Cust: " + custName : "";
      document.getElementById('lblCustAddr').innerText = custAddr ? custAddr : "";
    } else {
      custBox.style.display = "none";
    }

    const invCode = document.getElementById('invNum').value;
    if (codeType === "BARCODE") {
      document.getElementById('barcode').style.display = "block";
      document.getElementById('qrcode').style.display = "none";
      JsBarcode("#barcode", invCode, {
        format: "CODE128",
        height: 25,
        fontSize: 8,
        margin: 1
      });
    } else {
      document.getElementById('barcode').style.display = "none";
      const qrContainer = document.getElementById('qrcode');
      qrContainer.style.display = "flex";
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text: invCode + " | " + item + " | " + price,
        width: 40,
        height: 40
      });
    }
  }

  function toggleCodeType() {
    updateSticker();
  }

  function triggerPrint() {
    const qty = parseInt(document.getElementById('printQty').value) || 1;
    const printArea = document.getElementById('printArea');
    printArea.innerHTML = "";
    printArea.style.display = "block";

    const baseSticker = document.getElementById('stickerPreview');
    let historyRecords = JSON.parse(localStorage.getItem('bena_history') || '[]');

    for (let i = 0; i < qty; i++) {
      const clone = baseSticker.cloneNode(true);
      const invStr = "INV-" + String(currentSerial).padStart(4, '0');
      clone.querySelector('#lblInv').innerText = invStr;
      
      const codeType = document.getElementById('codeType').value;
      if(codeType === "BARCODE") {
        const barcodeSvg = clone.querySelector('#barcode');
        JsBarcode(barcodeSvg, invStr, { format: "CODE128", height: 25, fontSize: 8, margin: 1 });
      }
      
      printArea.appendChild(clone);

      historyRecords.unshift({
        inv: invStr,
        item: document.getElementById('itemSelect').value,
        size: document.getElementById('sizeSelect').value,
        price: document.getElementById('priceInput').value,
        date: new Date().getTime()
      });

      currentSerial++;
    }

    localStorage.setItem('bena_history', JSON.stringify(historyRecords));
    localStorage.setItem('bena_last_serial', currentSerial);

    document.getElementById('invNum').value = "INV-" + String(currentSerial).padStart(4, '0');
    document.getElementById('lblInv').innerText = document.getElementById('invNum').value;
    
    window.print();

    setTimeout(() => {
      printArea.style.display = "none";
      updateSticker();
    }, 500);
  }

  function resetSerial() {
    currentSerial = 1;
    localStorage.setItem('bena_last_serial', currentSerial);
    document.getElementById('invNum').value = "INV-0001";
    document.getElementById('lblInv').innerText = "INV-0001";
    updateSticker();
  }

  function openHistoryModal() {
    const modal = document.getElementById('historyModal');
    const listContainer = document.getElementById('historyList');
    listContainer.innerHTML = "";

    const historyRecords = JSON.parse(localStorage.getItem('bena_history') || '[]');

    if(historyRecords.length === 0) {
      listContainer.innerHTML = "<p style='text-align:center; color:#64748b; padding:20px;'>কোনো হিস্টরি পাওয়া যায়নি।</p>";
    } else {
      historyRecords.forEach(rec => {
        const dateStr = new Date(rec.date).toLocaleString('en-GB');
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div>
            <strong>${rec.inv}</strong> - ${rec.item} (${rec.size})
            <br><small style="color:#64748b;">মূল্য: ৳${rec.price} | তারিখ: ${dateStr}</small>
          </div>
        `;
        listContainer.appendChild(div);
      });
    }

    modal.style.display = 'flex';
  }

  function closeHistoryModal() {
    playSound();
    document.getElementById('historyModal').style.display = 'none';
  }

  function cleanOldHistory() {
    let historyRecords = JSON.parse(localStorage.getItem('bena_history') || '[]');
    const sevenDaysAgo = new Date().getTime() - (7 * 24 * 60 * 60 * 1000);
    historyRecords = historyRecords.filter(rec => rec.date >= sevenDaysAgo);
    localStorage.setItem('bena_history', JSON.stringify(historyRecords));
  }
</script>

</body>
</html>
